# digests/{cadence}/YYYY-MM-DD-{digest_id}.md — scheduled-agent outputs.
# digest_id defaults to the skill name; a skill that emits several digests
# per period (one per category) sets it per digest to keep filenames unique.
extends: default
required:
  - cadence
  - period_start
  - period_end
fields:
  cadence:
    type: string
    enum: [daily, weekly, biweekly, monthly, quarterly]
  period_start:
    type: date
  period_end:
    type: date
  items_count:
    type: integer
    required: false
  new_since_last:
    type: integer
    required: false
  digest_id:
    type: string
    required: false
    note: filename segment; equals source_skill unless the digest is one
      category slice of a multi-category skill
